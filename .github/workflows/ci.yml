name: CI

on:
  push:
    branches: [main, backend, frontend]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-32-bytes-minimum-aaaa
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: patrimoinehub_test
      POSTGRES_USER: patrimoine
      POSTGRES_PASSWORD: patrimoine
      REDIS_URL: redis://localhost:6379/0
      USE_S3: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (GIS + WeasyPrint + PostgreSQL 16 + pgvector)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin libgdal-dev binutils libproj-dev \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            libffi-dev shared-mime-info fonts-dejavu-core fonts-noto-core \
            postgresql-16 postgresql-16-postgis-3 postgresql-16-pgvector
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER patrimoine WITH PASSWORD 'patrimoine';"
          sudo -u postgres psql -c "CREATE DATABASE patrimoinehub_test OWNER patrimoine;"
          sudo -u postgres psql -d patrimoinehub_test -c "CREATE EXTENSION postgis;"
          sudo -u postgres psql -d patrimoinehub_test -c "CREATE EXTENSION vector;"

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations (sanity check)
        working-directory: backend
        run: python manage.py migrate --noinput

      # Informational: surfaces deploy-time security posture (SSL, HSTS,
      # cookies). Fails only on ERROR-level issues, not the expected
      # test-key / schema warnings.
      - name: Django deploy security check
        working-directory: backend
        env:
          DJANGO_DEBUG: "0"
        run: python manage.py check --deploy

      - name: Run pytest (with coverage)
        working-directory: backend
        run: pytest -v --cov=apps --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  security-audit:
    name: Backend — dependency CVE audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      # Non-blocking: surfaces known CVEs in dependencies without failing the
      # pipeline (some transitive pins lag upstream fixes). Review on each run.
      - name: Audit dependencies
        working-directory: backend
        continue-on-error: true
        run: pip-audit -r requirements.txt --desc

  frontend:
    name: Frontend — test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run unit tests (vitest)
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build
