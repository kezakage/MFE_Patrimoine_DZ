<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3b4cc0"/>
    </marker>
    <marker id="arrowDark" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2b3550"/>
    </marker>
    <style>
      .dot { fill:#3b4cc0; }
      .lbl { fill:#2b3550; }
      .node-txt { fill:#2b3550; font-weight:600; }
      .section-title { fill:#7a2f3a; font-weight:700; }
    </style>
  </defs>

  <!-- ===== Title bar ===== -->
  <rect x="20" y="14" width="1140" height="40" rx="10" fill="#f3b4b4"/>
  <text x="44" y="40" font-size="22" class="section-title">RAG — Retrieval Augmented Generation (PatrimoineHub)</text>

  <!-- ===== Outer container ===== -->
  <rect x="20" y="66" width="1140" height="478" rx="14" fill="#fdf2f2" stroke="#eccaca" stroke-width="1.5"/>

  <!-- ===== Left vertical panel (Query / Output) ===== -->
  <rect x="40" y="88" width="120" height="434" rx="12" fill="#f7c9c9"/>
  <!-- user icon -->
  <circle cx="100" cy="150" r="16" fill="#7a2f3a"/>
  <path d="M76 196 q24 -34 48 0 z" fill="#7a2f3a"/>
  <text x="100" y="234" font-size="20" text-anchor="middle" class="lbl" font-weight="700">Question</text>
  <text x="100" y="256" font-size="13" text-anchor="middle" fill="#7a2f3a">utilisateur</text>

  <text x="100" y="480" font-size="20" text-anchor="middle" class="lbl" font-weight="700">Réponse</text>
  <text x="100" y="502" font-size="13" text-anchor="middle" fill="#7a2f3a">sourcée</text>

  <!-- ===== RETRIEVAL section (pink) ===== -->
  <rect x="190" y="96" width="950" height="190" rx="12" fill="#f7c9c9"/>
  <text x="214" y="126" font-size="20" class="section-title">Retrieval (Indexation + Recherche)</text>

  <!-- Data sources sub-box -->
  <rect x="214" y="150" width="300" height="108" rx="10" fill="#fce4e4" stroke="#e7a9a9"/>
  <text x="232" y="176" font-size="15" class="node-txt">Sources documentaires</text>
  <text x="232" y="200" font-size="12.5" class="lbl">• Notices patrimoine (descriptions)</text>
  <text x="232" y="220" font-size="12.5" class="lbl">• Projets collaboratifs</text>
  <text x="232" y="240" font-size="12.5" class="lbl">• Pages Tiptap (versions)</text>

  <!-- arrow sources -> chunk/embed -->
  <line x1="514" y1="204" x2="592" y2="204" stroke="#2b3550" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- Chunking + Embedding node -->
  <rect x="594" y="158" width="190" height="92" rx="10" fill="#ffffff" stroke="#e7a9a9" stroke-width="1.5"/>
  <circle cx="689" cy="188" r="15" fill="none" stroke="#3b4cc0" stroke-width="2"/>
  <circle cx="681" cy="183" r="3" fill="#3b4cc0"/><circle cx="697" cy="183" r="3" fill="#3b4cc0"/><circle cx="689" cy="196" r="3" fill="#3b4cc0"/>
  <line x1="681" y1="183" x2="689" y2="196" stroke="#3b4cc0" stroke-width="1.5"/><line x1="697" y1="183" x2="689" y2="196" stroke="#3b4cc0" stroke-width="1.5"/>
  <text x="689" y="222" font-size="13.5" text-anchor="middle" class="node-txt">Chunking + Embedding</text>
  <text x="689" y="240" font-size="11" text-anchor="middle" fill="#7a2f3a">sentence-transformers · 768-dim</text>

  <!-- store vectors label + arrow -->
  <line x1="784" y1="204" x2="952" y2="204" stroke="#2b3550" stroke-width="2" marker-end="url(#arrowDark)"/>
  <text x="868" y="186" font-size="11.5" text-anchor="middle" fill="#7a2f3a">Stockage des vecteurs</text>
  <text x="868" y="200" font-size="11.5" text-anchor="middle" fill="#7a2f3a">denses (cosinus)</text>

  <!-- Vector DB node -->
  <rect x="954" y="158" width="160" height="92" rx="10" fill="#ffffff" stroke="#e7a9a9" stroke-width="1.5"/>
  <path d="M1034 176 l20 11 v18 l-20 11 l-20 -11 v-18 z" fill="none" stroke="#2b3550" stroke-width="2"/>
  <path d="M1034 176 l20 11 l-20 11 l-20 -11 z" fill="none" stroke="#2b3550" stroke-width="2"/>
  <text x="1034" y="226" font-size="14" text-anchor="middle" class="node-txt">Vector DB</text>
  <text x="1034" y="242" font-size="11" text-anchor="middle" fill="#7a2f3a">pgvector · HNSW</text>

  <!-- ===== User query dashed line ===== -->
  <line x1="160" y1="340" x2="690" y2="340" stroke="#3b4cc0" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
  <text x="420" y="330" font-size="13" text-anchor="middle" fill="#3b4cc0" font-weight="600">Requête utilisateur</text>
  <!-- vertical from query panel down -->
  <line x1="160" y1="300" x2="160" y2="340" stroke="#3b4cc0" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
  <!-- query feeds into retrieval (up arrow near embedding) -->
  <line x1="300" y1="340" x2="300" y2="262" stroke="#3b4cc0" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- dashed down into augmented -->
  <line x1="690" y1="340" x2="690" y2="392" stroke="#3b4cc0" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Extract data: vector db -> augmented -->
  <path d="M1034 250 v118 q0 14 -14 14 h-110" fill="none" stroke="#2b3550" stroke-width="2" marker-end="url(#arrowDark)"/>
  <text x="1080" y="320" font-size="11.5" text-anchor="middle" fill="#7a2f3a">Top-K</text>
  <text x="1080" y="334" font-size="11.5" text-anchor="middle" fill="#7a2f3a">extraits</text>

  <!-- ===== AUGMENTED section (blue) ===== -->
  <rect x="560" y="384" width="350" height="130" rx="12" fill="#dbe2f2" stroke="#b7c2e0"/>
  <text x="584" y="412" font-size="19" fill="#2f3a6b" font-weight="700">Augmented</text>
  <circle cx="600" cy="452" r="14" fill="none" stroke="#2f3a6b" stroke-width="2"/>
  <path d="M590 458 q10 12 20 0" fill="none" stroke="#2f3a6b" stroke-width="2"/>
  <text x="636" y="446" font-size="14" fill="#2f3a6b" font-weight="600">Extraits récupérés</text>
  <text x="636" y="468" font-size="14" fill="#2f3a6b" font-weight="600">+ Question</text>
  <text x="636" y="490" font-size="14" fill="#2f3a6b" font-weight="600">+ System Prompt</text>

  <!-- Augmented -> Generation arrow -->
  <line x1="560" y1="449" x2="470" y2="449" stroke="#2b3550" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- ===== GENERATION section (pink) ===== -->
  <rect x="200" y="384" width="270" height="130" rx="12" fill="#f7c9c9"/>
  <text x="224" y="412" font-size="19" class="section-title">Generation</text>
  <rect x="224" y="426" width="222" height="68" rx="10" fill="#ffffff" stroke="#e7a9a9" stroke-width="1.5"/>
  <circle cx="262" cy="460" r="13" fill="none" stroke="#2b3550" stroke-width="2"/>
  <path d="M255 453 l14 14 M269 453 l-14 14" stroke="#2b3550" stroke-width="2"/>
  <text x="350" y="455" font-size="14.5" text-anchor="middle" class="node-txt">LLM Mistral</text>
  <text x="350" y="474" font-size="11.5" text-anchor="middle" fill="#7a2f3a">via LangChain</text>

  <!-- Generation -> Output arrow -->
  <line x1="200" y1="449" x2="160" y2="449" stroke="#2b3550" stroke-width="2" marker-end="url(#arrowDark)"/>
</svg>
