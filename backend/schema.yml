components:
  schemas:
    AiStatusEnum:
      enum:
      - pending
      - done
      - failed
      - skipped
      type: string
      description: |-
        * `pending` - En attente
        * `done` - Terminé
        * `failed` - Échec
        * `skipped` - Ignoré
    Annotation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        media:
          type: integer
          nullable: true
        resource:
          type: integer
          nullable: true
        geometry_json: {}
        longitude:
          type: string
          readOnly: true
        latitude:
          type: string
          readOnly: true
        body_text:
          type: string
        author:
          allOf:
          - $ref: '#/components/schemas/UserMini'
          readOnly: true
        discipline:
          type: integer
          nullable: true
        is_ai_generated:
          type: boolean
        is_validated:
          type: boolean
        validated_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_at
      - id
      - latitude
      - longitude
      - validated_by
    AnnotationWrite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        media:
          type: integer
          nullable: true
        resource:
          type: integer
          nullable: true
        geometry_json: {}
        body_text:
          type: string
        discipline:
          type: integer
          nullable: true
        is_ai_generated:
          type: boolean
      required:
      - id
    AnnotationWriteRequest:
      type: object
      properties:
        media:
          type: integer
          nullable: true
        resource:
          type: integer
          nullable: true
        geometry_json: {}
        longitude:
          type: number
          format: double
          writeOnly: true
        latitude:
          type: number
          format: double
          writeOnly: true
        body_text:
          type: string
        discipline:
          type: integer
          nullable: true
        is_ai_generated:
          type: boolean
    ArchitecturalTypeEnum:
      enum:
      - mosque
      - medersa
      - casbah
      - palace
      - fortification
      - church
      - synagogue
      - mausoleum
      - traditional_house
      - archaeological_site
      - other
      type: string
      description: |-
        * `mosque` - Mosquée
        * `medersa` - Médersa
        * `casbah` - Casbah / Médina
        * `palace` - Palais
        * `fortification` - Fortification
        * `church` - Église
        * `synagogue` - Synagogue
        * `mausoleum` - Mausolée
        * `traditional_house` - Maison traditionnelle
        * `archaeological_site` - Site archéologique
        * `other` - Autre
    AskRequest:
      type: object
      description: Input payload for POST /chat/ask/.
      properties:
        message:
          type: string
          minLength: 2
          maxLength: 2000
        session_id:
          type: integer
          nullable: true
        anon_key:
          type: string
          maxLength: 64
      required:
      - message
    AskResponse:
      type: object
      properties:
        session_id:
          type: integer
        user_message:
          $ref: '#/components/schemas/ChatMessage'
        assistant_message:
          $ref: '#/components/schemas/ChatMessage'
        model:
          type: string
      required:
      - assistant_message
      - model
      - session_id
      - user_message
    ChatMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          $ref: '#/components/schemas/ChatMessageRoleEnum'
        content:
          type: string
        citations:
          type: string
          readOnly: true
        input_tokens:
          type: integer
          maximum: 2147483647
          minimum: 0
        output_tokens:
          type: integer
          maximum: 2147483647
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - citations
      - content
      - created_at
      - id
      - role
    ChatMessageRoleEnum:
      enum:
      - user
      - assistant
      - system
      type: string
      description: |-
        * `user` - Utilisateur
        * `assistant` - Assistant
        * `system` - Système
    ChatSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
          readOnly: true
      required:
      - created_at
      - id
      - messages
      - updated_at
    ClassificationLevelEnum:
      enum:
      - unesco
      - national
      - regional
      - unclassified
      type: string
      description: |-
