openapi: 3.0.3
info:
  title: PatrimoineHub API
  version: 0.1.0
  description: Collaborative platform for Algerian architectural heritage
paths:
  /api/v1/auth/2fa/disable/:
    post:
      operationId: v1_auth_2fa_disable_create
      description: |-
        POST /auth/2fa/disable/  body: {"otp": "123456"}
        Turns 2FA off and wipes the secret. A valid code is required while 2FA is
        active so a hijacked session cannot silently strip the protection.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/2fa/enable/:
    post:
      operationId: v1_auth_2fa_enable_create
      description: |-
        POST /auth/2fa/enable/  body: {"otp": "123456"}
        Confirms the user can read a valid code from their authenticator, then
        flips two_factor_enabled on.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/2fa/setup/:
    post:
      operationId: v1_auth_2fa_setup_create
      description: |-
        POST /auth/2fa/setup/
        Generates a fresh TOTP secret for the current user and returns the
        `otpauth://` provisioning URI. The frontend renders it as a QR code that
        the user scans with Google Authenticator / Authy. 2FA is NOT yet active —
        the user must confirm a code via /2fa/enable/ first.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/admin/stats/:
    get:
      operationId: v1_auth_admin_stats_retrieve
      description: |-
        GET /auth/admin/stats/
        Admin-only aggregated platform statistics:
          - user counts by status
          - project / discussion counts
          - list of pending expert requests (name, institution, disciplines)
        All computed in 4 DB queries — safe to call on every dashboard mount.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/admin/users/:
    get:
      operationId: v1_auth_admin_users_list
      description: |-
        Admin-only management of users. Includes the `validate` action which
        handles the workflow:
            - approve  → status=ACTIVE, sets validated_by/at
            - reject   → status=REJECTED
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - expert
          - researcher
          - visitor
        description: |-
          * `admin` - Administrateur
          * `expert` - Expert validé
          * `researcher` - Chercheur invité
          * `visitor` - Visiteur
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - pending
          - pending_email
          - rejected
        description: |-
          * `pending_email` - Email non confirmé
          * `pending` - En attente de validation
          * `active` - Actif
          * `rejected` - Rejeté
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: v1_auth_admin_users_create
      description: |-
        Admin-only management of users. Includes the `validate` action which
        handles the workflow:
            - approve  → status=ACTIVE, sets validated_by/at
            - reject   → status=REJECTED
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/admin/users/{id}/:
    get:
      operationId: v1_auth_admin_users_retrieve
      description: |-
        Admin-only management of users. Includes the `validate` action which
        handles the workflow:
            - approve  → status=ACTIVE, sets validated_by/at
            - reject   → status=REJECTED
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: v1_auth_admin_users_update
      description: |-
        Admin-only management of users. Includes the `validate` action which
        handles the workflow:
            - approve  → status=ACTIVE, sets validated_by/at
            - reject   → status=REJECTED
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: v1_auth_admin_users_partial_update
      description: |-
        Admin-only management of users. Includes the `validate` action which
        handles the workflow:
            - approve  → status=ACTIVE, sets validated_by/at
            - reject   → status=REJECTED
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: v1_auth_admin_users_destroy
      description: |-
        Permanently delete a user account.

        Two safeguards:
          - Admins cannot delete their own account — that would lock them out
            and risk leaving the platform with no administrator.
          - Many records (projects, page versions, discussions, media,
            annotations…) reference the user with ``on_delete=PROTECT``. A hard
            delete of an active contributor would raise ``ProtectedError``; we
            translate that into a clean 409 with guidance to suspend instead.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/admin/users/{id}/suspend/:
    post:
      operationId: v1_auth_admin_users_suspend_create
      description: |-
        Admin-only management of users. Includes the `validate` action which
        handles the workflow:
            - approve  → status=ACTIVE, sets validated_by/at
            - reject   → status=REJECTED
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/admin/users/{id}/validate/:
    post:
      operationId: v1_auth_admin_users_validate_create
      description: Admin-only. Transitions a user's `status` to either `ACTIVE` (on
        approve) or `REJECTED` (on reject). On success, a real-time WebSocket notification
        is pushed to the user via `/ws/notifications/` so the frontend can display
        a toast.
      summary: Approve or reject an expert account request
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateExpertRequest'
            examples:
              Approve:
                value:
                  decision: approve
              Reject:
                value:
                  decision: reject
                  note: Profil incomplet
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ValidateExpertRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ValidateExpertRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                Approve:
                  value:
                    decision: approve
                Reject:
                  value:
                    decision: reject
                    note: Profil incomplet
          description: ''
  /api/v1/auth/disciplines/:
    get:
      operationId: v1_auth_disciplines_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDisciplineList'
          description: ''
  /api/v1/auth/disciplines/{id}/:
    get:
      operationId: v1_auth_disciplines_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this discipline.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discipline'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_list
      description: GET/PATCH /auth/me/ — current user profile.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
  /api/v1/auth/me/{id}/:
    patch:
      operationId: v1_auth_me_partial_update
      description: GET/PATCH /auth/me/ — current user profile.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: |-
        POST /auth/register/ — public sign-up.

        The new account is created with `status=PENDING_EMAIL`. A signed token is
        sent to the supplied address; the user must click the link before they can
        log in.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/auth/resend-verification/:
    post:
      operationId: v1_auth_resend_verification_create
      description: |-
        POST /auth/resend-verification/  body: {"email": "..."}

        Always returns 200 with a generic message, regardless of whether an account
        exists or is already verified. This prevents email enumeration. The server
        enforces a 60-second per-account cooldown inside `send_verification_email`,
        AND a 5/hour per-IP rate limit via django-ratelimit to throttle abuse.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/social/github/:
    post:
      operationId: v1_auth_social_github_create
      description: |-
        Wraps SocialLoginView with a soft-fail when the provider has no credentials.
        This keeps the API up in dev environments where SSO isn't configured yet.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialLogin'
          description: ''
  /api/v1/auth/social/google/:
    post:
      operationId: v1_auth_social_google_create
      description: |-
        Wraps SocialLoginView with a soft-fail when the provider has no credentials.
        This keeps the API up in dev environments where SSO isn't configured yet.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialLogin'
          description: ''
  /api/v1/auth/social/providers/:
    get:
      operationId: v1_auth_social_providers_retrieve
      description: |-
        GET /api/v1/auth/social/providers/ — tells the frontend which provider
        buttons to show (only those that actually have credentials).
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/verify-email/:
    post:
      operationId: v1_auth_verify_email_create
      description: |-
        POST /auth/verify-email/  body: {"token": "..."}

        Validates the signed token, marks the address as verified, and transitions
        the user out of PENDING_EMAIL. Re-presenting an already-consumed token is
        treated as success so a double-click in the email client is not surfaced
        as an error.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/chat/ask/:
    post:
      operationId: v1_chat_ask_create
      description: 'Runs a retrieval-augmented generation (RAG) cycle: retrieves relevant
        chunks from the heritage knowledge base, asks Claude for a grounded answer,
        and persists both turns in the chat session. Anonymous callers may pass `anon_key`
        (an opaque token stored in browser localStorage) so their history is groupable
        without an account. Rate-limited per user/IP.'
      summary: Ask the heritage chatbot a question
      tags:
      - chatbot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
            examples:
              AskAboutCasbah:
                value:
                  message: Quelle est l'histoire de la Casbah d'Alger ?
                summary: Ask about Casbah
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AskRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
              examples:
                AskAboutCasbah:
                  value:
                    message: Quelle est l'histoire de la Casbah d'Alger ?
                  summary: Ask about Casbah
          description: ''
  /api/v1/chat/sessions/:
    get:
      operationId: v1_chat_sessions_list
      description: List / retrieve / delete the authenticated user's chat sessions.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChatSessionList'
          description: ''
  /api/v1/chat/sessions/{id}/:
    get:
      operationId: v1_chat_sessions_retrieve
      description: List / retrieve / delete the authenticated user's chat sessions.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
          description: ''
    delete:
      operationId: v1_chat_sessions_destroy
      description: List / retrieve / delete the authenticated user's chat sessions.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/discussions/:
    get:
      operationId: v1_discussions_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - archived
          - open
          - resolved
        description: |-
          * `open` - Ouvert
          * `resolved` - Résolu
          * `archived` - Archivé
      - in: query
        name: type
        schema:
          type: string
          enum:
          - conflict
          - general
          - review
        description: |-
          * `general` - Général
          * `conflict` - Conflit éditorial
          * `review` - Révision
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDiscussionList'
          description: ''
    post:
      operationId: v1_discussions_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscussionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DiscussionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DiscussionRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
